; Copy to inventory.ini (gitignored) and fill in.
;
; First run against a fresh Strato box, before the deploy user exists:
;   ansible_user=root
; Every run after that, once the playbook has created the deploy user and
; turned off root login:
;   ansible_user=deploy

[connector]
connector.example.com ansible_user=root

[connector:vars]
; Keys allowed to log in as the deploy user. The CI deploy key MUST be in here
; or the pipeline cannot reach the box. Password auth is off after the first
; run, so a key missing here is a rescue-console trip.
ssh_public_keys=["ssh-ed25519 AAAA... you@laptop", "ssh-ed25519 AAAA... github-actions"]

[build-system]
requires = ["uv_build>=0.11"]
build-backend = "uv_build"

[project]
name = "diffus"
version = "0.1.0"
description = "diffus.space digital backbone: crossposting (Instagram → Telegram) and, next, calendar"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.143.0",
    "uvicorn[standard]>=0.30",
    "jinja2>=3.1",
    "python-multipart>=0.0.20",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.32.0",
    "alembic>=1.20.0",
    "httpx>=0.28",
    "pydantic-settings>=2.4",
    "apscheduler>=3.11,<4",
    "tzdata>=2026.5",
    "pillow>=12",
    "sentry-sdk[fastapi]>=2.72.0",
]

[dependency-groups]
dev = [
    "prek>=0.5.5",
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.17.0",
    "ty",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC"]

[tool.ty.environment]
python-version = "3.14"

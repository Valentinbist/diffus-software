# Dev stack: builds the `dev` target and runs uvicorn --reload against the
# bind-mounted sources. The production stack lives in infra/compose/ and uses
# the `runtime` image from GHCR.
#
#   docker compose up --build        # plain: edits under src/ hot-reload
#   docker compose up --watch        # + rebuild on pyproject.toml/uv.lock,
#                                    #   restart on new alembic migrations
#   docker compose exec app pytest   # tests inside the container

services:
  app:
    build:
      context: .
      target: dev
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://connector:connector@postgres:5432/connector
    ports:
      - "8000:8000"
    volumes:
      # Bind-mounted so uvicorn --reload sees edits without a rebuild.
      - ./src:/app/src
      - ./tests:/app/tests
      - ./alembic:/app/alembic
      - ./alembic.ini:/app/alembic.ini
    develop:
      watch:
        - path: pyproject.toml
          action: rebuild
        - path: uv.lock
          action: rebuild
        # The entrypoint runs `alembic upgrade head`, so a restart applies a
        # new migration.
        - path: alembic
          action: restart
    depends_on:
      postgres:
        condition: service_healthy
      web:
        condition: service_started
    restart: unless-stopped

  # Rebuilds web/ into src/diffus/shared/presentation/static/dist on every
  # save; uvicorn --reload (via --reload-include manifest.json) picks up the
  # new manifest and app.py's assets.py re-reads it on the next request.
  web:
    image: node:22-alpine
    working_dir: /app/web
    command: sh -c "npm install && npm run watch"
    volumes:
      - ./web:/app/web
      - ./src:/app/src
      - web_node_modules:/app/web/node_modules
    restart: unless-stopped

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: connector
      POSTGRES_PASSWORD: connector
      POSTGRES_DB: connector
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U connector"]
      interval: 5s
      retries: 10
    restart: unless-stopped

  # TLS: put Caddy or a tunnel (Tailscale/cloudflared) in front of :8000.
  # Required anyway — basic auth is cleartext without it, and the Instagram
  # OAuth redirect URI must be public HTTPS.

volumes:
  pgdata:
  # Named, not bind-mounted: node_modules holds Linux binaries and must not
  # be shared with the host's (possibly macOS/arm64) node_modules.
  web_node_modules:

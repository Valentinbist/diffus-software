<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Social Posts{% endblock %}</title>
  <meta name="theme-color" content="#020202">
  <link rel="icon" href="/static/dist/icons/favicon.png" type="image/png">
  <link rel="apple-touch-icon" href="/static/dist/icons/apple-touch-icon.png">
  <link rel="manifest" href="/static/dist/manifest.webmanifest">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="diffus">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fira+Sans:ital,wght@0,400;0,500;1,400&family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=swap">
  <link rel="stylesheet" href="{{ assets.css }}">
  <script>document.documentElement.classList.add("js")</script>
  <script type="module" src="{{ assets.js }}"></script>
</head>
<body>
  <div class="backdrop" hx-get="/backdrop" hx-trigger="load" hx-swap="outerHTML"></div>
  <aside class="side">
    <a class="brand plain" href="/">diffus.space</a>
    <a class="btn btn-solid cta" href="/neu" data-modal>{% if calendar_enabled %}Neues Event erstellen{% else %}Neuer Post{% endif %}</a>
    <nav class="nav">
      <a class="plain{% if active_page == "posts" %} current{% endif %}" href="/">Social Posts</a>
      <a class="plain{% if active_page == "review" %} current{% endif %}" href="/freigabe">Freigabe <span hx-get="/freigabe/count" hx-trigger="load" hx-swap="innerHTML"></span></a>
      {% if calendar_enabled %}<a class="plain{% if active_page == "calendar" %} current{% endif %}" href="/calendar">Kalender</a>{% endif %}
      <a class="plain{% if active_page == "settings" %} current{% endif %}" href="/einstellungen">Einstellungen</a>
    </nav>
  </aside>
  <main><div class="page">{% block content %}{% endblock %}</div></main>
  <dialog id="modal" hx-boost="true" hx-target="#modal-body" hx-select=".page" hx-swap="innerHTML">
    <div class="modal-inner">
      <p class="meta modal-bar"><a class="plain" id="modal-close" href="/" hx-boost="false">Schließen</a></p>
      <div id="modal-body"></div>
    </div>
  </dialog>
</body>
</html>

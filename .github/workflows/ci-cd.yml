name: CI/CD

# One click = push to main, or hit "Run workflow" on this file.
# check runs on every PR; build and deploy only ever run on main, and only if
# check passed, so a red test can't reach the box.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Frontend build
        working-directory: web
        run: npm ci && npm run check && npm run build

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - run: uv sync --frozen

      - name: Lint
        run: uv run ruff check .

      - name: Type check
        run: uv run ty check

      - name: Test
        run: uv run pytest -q

  build:
    needs: check
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve image name
        id: meta
        # GHCR rejects uppercase; the owner name is not guaranteed lowercase.
        run: |
          repo=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "image=${{ env.REGISTRY }}/${repo}:${{ github.sha }}" >> "$GITHUB_OUTPUT"
          echo "repo=${{ env.REGISTRY }}/${repo}" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}
            ${{ steps.meta.outputs.repo }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4

      - name: Authorise SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          if [ -n "$SSH_KNOWN_HOSTS" ]; then
            printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          else
            # Trust-on-first-use. Pin it properly by capturing
            # `ssh-keyscan -t ed25519 <host>` into the SSH_KNOWN_HOSTS secret.
            echo "::warning::SSH_KNOWN_HOSTS unset - host key not pinned"
            ssh-keyscan -t ed25519 "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          fi
          chmod 600 ~/.ssh/known_hosts

      - name: Ship compose files
        run: |
          scp -i ~/.ssh/id_ed25519 \
            infra/compose/docker-compose.yml infra/compose/Caddyfile \
            deploy@${{ secrets.DEPLOY_HOST }}:/opt/connector/

      - name: Render .env from secrets
        # Built on the runner, moved as base64 so no value is ever re-quoted by
        # a shell. This is the only writer of /opt/connector/.env.
        env:
          ENV_FILE: |
            APP_IMAGE=${{ needs.build.outputs.image }}
            APP_DOMAIN=${{ secrets.APP_DOMAIN }}
            POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
            IG_APP_ID=${{ secrets.IG_APP_ID }}
            IG_APP_SECRET=${{ secrets.IG_APP_SECRET }}
            IG_REDIRECT_URI=${{ secrets.IG_REDIRECT_URI }}
            TELEGRAM_BOT_TOKEN=${{ secrets.TELEGRAM_BOT_TOKEN }}
            TELEGRAM_CHAT_IDS=${{ secrets.TELEGRAM_CHAT_IDS }}
            KALENDER_DIGITAL_TOKEN=${{ secrets.KALENDER_DIGITAL_TOKEN }}
            BASIC_AUTH_USERNAME=${{ secrets.BASIC_AUTH_USERNAME }}
            BASIC_AUTH_PASSWORD=${{ secrets.BASIC_AUTH_PASSWORD }}
        run: |
          printf '%s' "$ENV_FILE" | base64 -w0 > env.b64
          scp -i ~/.ssh/id_ed25519 env.b64 deploy@${{ secrets.DEPLOY_HOST }}:/opt/connector/env.b64

      - name: Pull and restart
        run: |
          ssh -i ~/.ssh/id_ed25519 deploy@${{ secrets.DEPLOY_HOST }} bash -euo pipefail <<'REMOTE'
            cd /opt/connector
            base64 -d env.b64 > .env && chmod 600 .env && rm -f env.b64
            echo "${{ secrets.GITHUB_TOKEN }}" \
              | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
            docker compose pull
            docker compose up -d --remove-orphans
            docker logout ghcr.io
            docker image prune -af --filter "until=168h"
          REMOTE

      - name: Verify the deploy is actually serving
        run: |
          for i in $(seq 1 30); do
            if curl -fsS --max-time 10 "https://${{ secrets.APP_DOMAIN }}/healthz" > /dev/null; then
              echo "healthy after ${i} attempt(s)"
              exit 0
            fi
            sleep 10
          done
          echo "::error::/healthz never returned 200 - deploy is not serving"
          exit 1

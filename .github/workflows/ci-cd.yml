name: CI/CD

# One click = push to main, or hit "Run workflow" on this file.
# check runs on every PR; build and deploy only ever run on main, and only if
# check passed, so a red test can't reach the box.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Frontend build
        working-directory: web
        run: npm ci && npm run check && npm run build

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - run: uv sync --frozen

      - name: Lint
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check .

      - name: Type check
        run: uv run ty check

      - name: Test
        run: uv run pytest -q

  build:
    needs: check
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve image name
        id: meta
        # GHCR rejects uppercase; the owner name is not guaranteed lowercase.
        run: |
          repo=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "image=${{ env.REGISTRY }}/${repo}:${{ github.sha }}" >> "$GITHUB_OUTPUT"
          echo "repo=${{ env.REGISTRY }}/${repo}" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v7
        with:
          context: .
          target: runtime
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}
            ${{ steps.meta.outputs.repo }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: production
    # Two deploys racing would leave Coolify on whichever tag landed last.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7

      - name: Deploy through Coolify
        # Sets the app's image tag to this commit, triggers the deployment and
        # waits for it. The app's env (credentials, PUBLIC_BASE_URL, ...) lives
        # in Coolify, not here — see "Deployment" in readme.md.
        env:
          COOLIFY_URL: ${{ secrets.COOLIFY_URL }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
          COOLIFY_APP_UUID: ${{ secrets.COOLIFY_APP_UUID }}
        run: scripts/coolify-deploy.sh "${{ github.sha }}"

      - name: Verify the deploy is actually serving
        # Coolify's own health check runs inside the server; this one goes
        # through DNS, the proxy and TLS, the way Instagram and the browser do.
        run: |
          for i in $(seq 1 30); do
            if curl -fsS --max-time 10 "https://${{ secrets.APP_DOMAIN }}/healthz" > /dev/null; then
              echo "healthy after ${i} attempt(s)"
              exit 0
            fi
            sleep 10
          done
          echo "::error::/healthz never returned 200 - deploy is not serving"
          exit 1
